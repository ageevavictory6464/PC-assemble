<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/style.css">
    <title>ПК</title>
</head>

<body>
    <header class="header">
        <div class="header-wrap">
            <a href="#" class="logo">
                <img src="img/logo.svg" alt="logo">
            </a>
            <div class="header-menu">
                <nav class="nav">
                    <a href="#">Чем занимаемся</a>
                    <a href="#">Процесс работы</a>
                    <a href="#">Команда</a>
                </nav>
                <button type="button" class="button header-button">Оставить заявку</button>
            </div>
        </div>
    </header>
    <main class="main">
        <section class="main-display">
            <div class="container">
                <h1 class="main-text">Собираем игровой ПК под ваш бюджет</h1>
                <div class="timer main-timer">
                    <div class="timer-item">
                        <div class="timer-count">18</div>
                        <div class="timer-text">Дней</div>
                    </div>
                    <div class="timer-item">
                        <div class="timer-count">18</div>
                        <div class="timer-text">Часов</div>
                    </div>
                    <div class="timer-item">
                        <div class="timer-count">18</div>
                        <div class="timer-text">Минут</div>
                    </div>
                    <div class="timer-item">
                        <div class="timer-count">18</div>
                        <div class="timer-text">Секунд</div>
                    </div>
                </div>
                <button class="button main-button">Оставить заявку</button>
            </div>
            <div class="main-background">
                <img src="img/main-screen__bgc.png" alt="background">
            </div>
        </section>
    </main>
</body>

</html>
